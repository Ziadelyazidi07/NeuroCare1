# NeuroCare — environnement de développement et de démo (cahier §15.2)
# Usage : cp .env.example .env  (puis renseigner les secrets) ; docker compose up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: neurocare
      POSTGRES_USER: neurocare
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurocare -d neurocare"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?MINIO_USER requis}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD requis}
    volumes: ["miniodata:/data"]
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]

  audio-service:
    build:
      context: ../audio-service
      target: runtime
    environment:
      INTERNAL_KEY: ${AUDIO_INTERNAL_KEY:?AUDIO_INTERNAL_KEY requis}
      TTS_ENGINE: espeak          # espeak | none
      CLONING_ENGINE: none        # point d'extension XTTS v2 (GPU)
    volumes: ["audiodata:/data"]
    # non exposé à Internet : accessible uniquement depuis le réseau compose

  backend:
    build: ../backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      audio-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/neurocare
      SPRING_DATASOURCE_USERNAME: neurocare
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      NEUROCARE_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      NEUROCARE_AUDIO_BASE_URL: http://audio-service:8000
      NEUROCARE_AUDIO_INTERNAL_KEY: ${AUDIO_INTERNAL_KEY}
      NEUROCARE_STORAGE_PROVIDER: minio
      NEUROCARE_STORAGE_ENDPOINT: http://minio:9000
      # Hôte des URL signées vu par les téléphones (IP du poste en démo locale).
      NEUROCARE_STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    ports: ["${BACKEND_PORT:-8080}:8080"]

volumes:
  pgdata: {}
  miniodata: {}
  audiodata: {}
