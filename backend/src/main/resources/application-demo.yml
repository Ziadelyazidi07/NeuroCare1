# Profil demo : scénario de 3 min (cahier §2.2), délais réduits (cahier §9.6), données fictives.
# Ne jamais activer en production : il charge des comptes de démonstration aux identifiants publics.
spring:
  flyway:
    # V99__demo_data.sql n'est chargé qu'avec ce profil.
    locations: classpath:db/migration,classpath:db/demo
    # Les migrations du produit ajoutées après V99 restent applicables sur une base de démo existante.
    out-of-order: true

neurocare:
  reminder:
    tick: PT10S                 # envoi et clôture toutes les 10 s (ENF-02 en démo)
    relance-after: PT30S        # relance unique à +30 s
    default-timeout: PT1M
    timeout-override: PT1M      # SANS_REPONSE à +1 min pour tous les seniors
    lookahead-hours: 48
