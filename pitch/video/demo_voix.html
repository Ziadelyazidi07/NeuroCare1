// ---------------------------------------------------------------- Outils d'animation
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eout = (x) => 1 - Math.pow(1 - x, 3);
const eback = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const fadeIn = (t, a, d = .45) => eout(prog(t, a, a + d));
const window_ = (t, a, b, d = .4) => Math.min(fadeIn(t, a, d), 1 - eio(prog(t, b - d, b)));
const css = (el, o) => { const e = typeof el === 'string' ? $(el) : el; Object.assign(e.style, o); };
const show = (el, op, dy = 0, sc = 1) => css(el, { opacity: op, transform: `translateY(${dy}px) scale(${sc})` });
const speaking = (t, [a, b]) => t > a && t < b;

const PHONE = { x: 420, y: 110 };
function at(id, fx = .5, fy = .5) {
  const s = $('screen'), el = $(id), k = s.getBoundingClientRect().width / 392;
  const host = el.closest('.scr'), hidden = host && host.style.display === 'none';
  if (hidden) host.style.display = 'block';
  const r = el.getBoundingClientRect(), o = s.getBoundingClientRect();
  if (hidden) host.style.display = 'none';
  return [(r.left - o.left + r.width * fx) / k, (r.top - o.top + r.height * fy) / k];
}
function camera(s, fx, fy, dx = 0) {
  const ox = PHONE.x + 14 + 196 + dx, oy = PHONE.y + 14 + 416;
  return { tx: ox - (14 + fx) * s, ty: oy - (14 + fy) * s };
}
function cursorAt(x, y, op, press = 0, ripple = 0) {
  const ph = $('phone').getBoundingClientRect(), k = ph.width / 420;
  const sx = ph.left + (14 + x) * k, sy = ph.top + (14 + y) * k;
  css('cursor', { left: sx + 'px', top: sy + 'px', opacity: op, transform: `scale(${1 - .25 * press})` });
  const r = 20 + 70 * ripple;
  css('ripple', { left: sx - r + 'px', top: sy - r + 'px', width: 2 * r + 'px', height: 2 * r + 'px', opacity: ripple > 0 && ripple < 1 ? (1 - ripple) * .9 : 0 });
}
function cursorPath(t, keys) {
  let pos = null, press = 0, rip = 0;
  for (let i = 0; i < keys.length; i++) {
    const [tk, target, tap] = keys[i];
    const p = typeof target === 'string' ? at(target) : target;
    if (t >= tk) pos = p;
    if (i + 1 < keys.length && t >= tk && t < keys[i + 1][0]) {
      const [tn, tg2] = keys[i + 1];
      const q = typeof tg2 === 'string' ? at(tg2) : tg2;
      const x = eio(prog(t, tn - .6, tn));
      pos = [lerp(p[0], q[0], x), lerp(p[1], q[1], x)];
    }
    if (tap) { const d = 1 - Math.abs(t - tk) / .12; press = Math.max(press, d > 0 ? d : 0); if (t >= tk && t < tk + .55) rip = (t - tk) / .55; }
  }
  return { pos, press, rip };
}
function caption(t, items) {
  let cur = null;
  for (const it of items) if (t >= it.a && t < it.b) cur = it;
  if (!cur) { css('caption', { opacity: 0 }); return; }
  $('chip').innerHTML = cur.chip; $('headline').innerHTML = cur.h; $('sub').innerHTML = cur.s;
  css('caption', { opacity: window_(t, cur.a, cur.b, .4) });
  show('chip', fadeIn(t, cur.a, .4), 16 * (1 - fadeIn(t, cur.a, .4)));
  show('headline', fadeIn(t, cur.a + .1, .5), 30 * (1 - fadeIn(t, cur.a + .1, .5)));
  show('sub', fadeIn(t, cur.a + .25, .5), 30 * (1 - fadeIn(t, cur.a + .25, .5)));
}
/** Sous-titres de la voix, mot à mot (la voix est régulière : progression linéaire sur la durée de la réplique). */
function subtitle(t, [a, b], text, who) {
  const words = text.split(' '), n = Math.ceil(words.length * prog(t, a - .05, b - .3));
  const said = words.slice(0, Math.max(1, n)).join(' ');

}

// ---------------------------------------------------------------- Timeline

  for (let i = 0; i < 22; i++) {
    const h = 4 + (playing ? 20 : 2) * Math.abs(Math.sin(t * 7.9 + i * .83) * Math.cos(t * 2.9 + i * .31));

    const k = rep ? 1 : 0.15;

  // Bascule vers le téléphone de Salma (26 → 36 s), puis retour sur celui de Mama
  const out1 = eio(prog(t, 25.9, 26.6)), back1 = eio(prog(t, 35.6, 36.3));

  if (t < 12.5) { sub = subtitle(t, V.rappel, MESSAGE, 'Salma'); sOp = window_(t, V.rappel[0], V.rappel[1] + .6, .3); }
  else if (t > 28 && t < 35) { sub = subtitle(t, V.bravo, 'Bravo Mama ! Je suis fière de toi. Je t’aime.', 'Salma'); sOp = window_(t, V.bravo[0], V.bravo[1] + .6, .3); }
  else if (t > 36 && t < 41) { sub = subtitle(t, V.dj, 'ما تخافيش، ما تاخديش جوج دوايات فمرة.', 'Assistant'); sOp = window_(t, V.dj[0], V.dj[1] + .3, .3); }
  $('subs').innerHTML = sub;
  css('subs', { opacity: sOp });

  // Caméra du téléphone de Mama
  let s = 1, fx = 196, fy = 416;
  const zoomTo = (a, b, sc, x, y, d = .6) => {
    const k = Math.min(eio(prog(t, a, a + d)), 1 - eio(prog(t, b - d, b)));
    if (k > 0) { s = lerp(s, sc, k); fx = lerp(fx, x, k); fy = lerp(fy, y, k); }
  };
  zoomTo(1.2, 11.4, 1.22, 196, 330, .8);
  zoomTo(13.2, 24.3, 1.15, 196, 420, .6);
  zoomTo(36.4, 40.3, 1.1, 196, 420, .6);
  const pdfK = eio(prog(t, 40.3, 40.9));
  const dx = lerp(0, -170, pdfK);
  s = lerp(s, .92, pdfK);
  const enter = eout(prog(t, 0, .5));
  const { tx, ty } = camera(s, fx, fy, dx);
  css('phone', { transform: `translate(${tx - PHONE.x - 520 * out1 * (1 - back1)}px, ${ty - PHONE.y + (1 - enter) * 120}px) scale(${s})`, opacity: enter * (1 - out1 * (1 - back1)) });

  const pdfIn = eout(prog(t, 40.5, 41.2));
  css('pdf', { opacity: pdfIn * (1 - outro), transform: `translateY(${(1 - pdfIn) * 80}px) scale(${lerp(.9, 1, pdfIn) * lerp(1, 1.025, prog(t, 41.2, 42.9))})` });
  show('fnchip', fadeIn(t, 41.1, .4) * (1 - outro), 16 * (1 - fadeIn(t, 41.1, .4)));
  caption(t, CAPTIONS);

  // Curseur : [temps, cible, appui]
  const paths = [
    [.9, 2.0, [[.9, [300, 560], 0], [1.45, 'lockNotif-play', 1], [2.0, [320, 600], 0]]],
    [11.1, 12.2, [[11.1, [300, 600], 0], [11.75, 'lockNotif', 1], [12.2, [320, 640], 0]]],
    [13.2, 14.4, [[13.2, [300, 640], 0], [13.9, 'replayBtn', 1], [14.4, [330, 700], 0]]],
    [24.0, 25.4, [[24.0, [300, 760], 0], [24.75, 'doneBtn', 1], [25.4, [300, 760], 0]]],
  ];
  let cur = { pos: null }, op = 0;
  for (const [a, b, keys] of paths) if (t >= a && t < b) { cur = cursorPath(t, keys); op = window_(t, a, b, .25); }
  if (cur.pos) cursorAt(cur.pos[0], cur.pos[1], op, cur.press, cur.rip); else { css('cursor', { opacity: 0 }); css('ripple', { opacity: 0 }); }
}
window.renderFrame = renderFrame;
window.renderStill = renderFrame;
</script>
