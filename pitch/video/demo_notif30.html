    <div class="status" id="status1"><span id="clock">20:00</span><span class="row" style="gap:6px"><i class="ion" data-i="cellular" style="font-size:16px"></i><i class="ion" data-i="wifi" style="font-size:16px"></i><i class="ion" data-i="battery-full" style="font-size:22px"></i></span></div>
  </div></div>
  <div id="phone2"><div class="bezel"></div><div class="screen" id="screen2"><div class="island"></div>
    <div class="status"><span>20:01</span><span class="row" style="gap:6px"><i class="ion" data-i="wifi" style="font-size:16px"></i><i class="ion" data-i="battery-full" style="font-size:22px"></i></span></div>
  </div></div>
  <div id="ripple"></div><div id="cursor"></div>

  <div id="outro" class="full" style="display:none"><img id="outroLogo" src="../assets/neurocare-logo-transparent.png" style="width:470px" />
    <div class="bigtag" id="outroTag">« La voix de ceux qui l’aiment, chaque jour à ses côtés. »</div>
  </div>
</div>

<script>
'use strict';
const ION = window.ION || {};
const ic = (name, size, colour) => `<i class="ion" style="font-size:${size}px;color:${colour}">${String.fromCodePoint(ION[name] || 0x3f)}</i>`;
const $ = (id) => document.getElementById(id);

/* Instants des voix et des sons : pitch/build/notif30/timeline.json (écrit par compose_notif30_audio.py --tts). */
const V = { rappel: [1.0, 9.23], bravo: [14.35, 17.42] };
const SFX = { chime: .4, tap: 13.75, confirm: 22.0 };

/* Notification (i18n/fr/observance.ts : dueTitle, dueBody, listen). */
function lockScreen() {
  const bars = Array.from({ length: 22 }, (_, i) => `<i id="nb${i}"></i>`).join('');
  return `<div class="scr" id="lock"><div class="lock"><div class="ldate">samedi 21 novembre</div><div class="ltime">20:00</div>
    <div class="lhint">Touchez la notification pour ouvrir NeuroCare</div></div>
    <div class="notif" id="lockNotif"><img src="../assets/neurocare-logo.png" /><div style="flex:1">
      <div class="row" style="justify-content:space-between;font-size:13px;color:#55657E"><b style="color:#112950">NeuroCare</b><span>maintenant</span></div>
      <div style="font-size:16px;font-weight:800;color:#112950">C'est l'heure de ton médicament</div>
      <div style="font-size:14.5px">Metformine 850 mg — appuie sur « C'est fait »</div>
      <div class="nplay">${ic('play-circle', 22, '#246BFD')}<span id="nLab">Écouter le message</span><div class="nwave">${bars}</div></div></div></div></div>`;
}

/* Espace senior (i18n/fr/observance.ts : hello, dueTitle, done, saved, next, call) — mode démo : Hajja Zahra, Salma. */
function seniorScreen() {
  const bars = Array.from({ length: 30 }, (_, i) => `<i id="bar${i}"></i>`).join('');
  return `<div class="scr" id="senior"><div class="scroll" style="gap:14px">
    <div style="font-size:24px;font-weight:700;color:#55657E;margin-top:6px">Bonjour Hajja Zahra</div>
    <div class="senior-title">C’est l’heure de ton médicament</div>
    <div class="card"><div class="row" style="gap:12px"><div style="width:58px;height:58px;border-radius:18px;background:#EBF2FF;display:flex;align-items:center;justify-content:center">${ic('medkit', 32, '#246BFD')}</div>
      <div><div class="med">Metformine 850 mg</div><div style="font-size:19px;color:#55657E">1 comprimé · 20:00</div></div></div></div>
    <div class="voice"><div class="row" style="gap:12px"><div class="avatar">S</div><div><div style="font-size:20px;font-weight:800;color:#112950">Salma, votre fille</div>
      <div style="font-size:16px;color:#55657E" id="vState">Message vocal · 0:08</div></div></div>
      <div class="wave">${bars}</div></div>
    <div class="done" id="doneBtn" style="background:#10B981;box-shadow:0 10px 24px rgba(16,185,129,.4)">${ic('checkmark-circle', 44, '#fff')}<span id="doneTxt">C’est fait</span></div>
    <div class="card row" style="gap:12px">${ic('alarm', 30, '#55657E')}<div><div style="font-size:18px;color:#55657E">Prochain rappel</div><div style="font-size:21px;font-weight:800;color:#112950">demain 08:00 · Metformine 850 mg</div></div></div>
  </div></div>`;
}

/* Espace aidant : tableau de bord (i18n/fr/observance.ts : doseStatus, confirmedAt, summary). */
function aidantScreen() {
  const dose = (time, name, status, ok, id = '', last = false) => `<div class="dose" ${last ? 'style="border:0"' : ''}><div class="dot" ${id ? `id="${id}Dot"` : ''} style="background:${ok ? '#167A45' : '#6B7280'}"></div>
    <div style="flex:1"><b style="color:#112950;font-size:17px">${time} · ${name}</b><div style="font-size:15px;color:${ok ? '#167A45' : '#55657E'};font-weight:${ok ? 800 : 400}" ${id ? `id="${id}Status"` : ''}>${status}</div></div></div>`;
  return `<div class="scr"><div class="scroll" style="gap:14px">
    <div class="row" style="gap:8px;margin-top:4px"><span class="badge" style="background:#FEF3C7;color:#8A4600">Mode démo hors ligne</span></div>
    <div style="font-size:24px;font-weight:800;color:#112950">Mama · Hajja Zahra</div>
    <div class="row" style="gap:8px"><span class="badge" style="background:#DCFCE7;color:#167A45">● Temps réel</span><span class="muted" style="font-size:15px">Aujourd’hui (21/11/2026)</span></div>
    <div class="card" style="padding:6px 16px">
      ${dose('08:00', 'Metformine 850 mg', 'Confirmé à 08:04', true)}
      ${dose('13:00', 'Amlodipine 5 mg', 'Confirmé à 13:12', true)}
      ${dose('20:00', 'Metformine 850 mg', 'En attente', false, 'a', true)}
    </div>
    <div class="muted" style="font-size:15px" id="aSummary">2 confirmé(s) · 0 sans réponse · 1 en attente</div>
    <div class="card row" id="aToast" style="gap:10px;background:#DCFCE7;border-color:#BBF7D0">${ic('checkmark-circle', 30, '#167A45')}<div style="font-size:17px;font-weight:800;color:#14653A">Hajja Zahra a confirmé la prise de 20:00</div></div>
  </div></div>`;
}

$('screen').insertAdjacentHTML('beforeend', lockScreen() + seniorScreen());
$('screen2').insertAdjacentHTML('beforeend', aidantScreen());
$('vwBars').innerHTML = Array.from({ length: 28 }, (_, i) => `<i id="vb${i}"></i>`).join('');
document.querySelectorAll('[data-i]').forEach((el) => { el.textContent = String.fromCodePoint(ION[el.dataset.i] || 0x3f); });

// ---------------------------------------------------------------- Outils d'animation
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eout = (x) => 1 - Math.pow(1 - x, 3);
const eback = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const fadeIn = (t, a, d = .45) => eout(prog(t, a, a + d));
const window_ = (t, a, b, d = .4) => Math.min(fadeIn(t, a, d), 1 - eio(prog(t, b - d, b)));
const css = (el, o) => { const e = typeof el === 'string' ? $(el) : el; Object.assign(e.style, o); };
const show = (el, op, dy = 0, sc = 1) => css(el, { opacity: op, transform: `translateY(${dy}px) scale(${sc})` });
const speaking = (t, [a, b]) => t > a && t < b;
/** Amplitude « vocale » : syllabes (~4,5 Hz) modulées par des respirations, nulle hors de la réplique. */
const voiceLevel = (t, line, i) => (speaking(t, line) ? .25 + .75 * Math.abs(Math.sin(t * 14.1 + i * .7) * Math.sin(t * 2.9 + i * .23)) : 0);

const PHONE = { x: 420, y: 110 };
function at(id, fx = .5, fy = .5) {
  const s = $('screen'), el = $(id), k = s.getBoundingClientRect().width / 392;
  const host = el.closest('.scr'), hidden = host && host.style.display === 'none';
  if (hidden) host.style.display = 'block';
  const r = el.getBoundingClientRect(), o = s.getBoundingClientRect();
  if (hidden) host.style.display = 'none';
  return [(r.left - o.left + r.width * fx) / k, (r.top - o.top + r.height * fy) / k];
}
function camera(s, fx, fy) {
  const ox = PHONE.x + 14 + 196, oy = PHONE.y + 14 + 416;
  return { tx: ox - (14 + fx) * s, ty: oy - (14 + fy) * s };
}
function cursorAt(x, y, op, press = 0, ripple = 0) {
  const ph = $('phone').getBoundingClientRect(), k = ph.width / 420;
  const sx = ph.left + (14 + x) * k, sy = ph.top + (14 + y) * k;
  css('cursor', { left: sx + 'px', top: sy + 'px', opacity: op, transform: `scale(${1 - .25 * press})` });
  const r = 20 + 70 * ripple;
  css('ripple', { left: sx - r + 'px', top: sy - r + 'px', width: 2 * r + 'px', height: 2 * r + 'px', opacity: ripple > 0 && ripple < 1 ? (1 - ripple) * .9 : 0, borderColor: '#10B981' });
}
function cursorPath(t, keys) {
  let pos = null, press = 0, rip = 0;
  for (let i = 0; i < keys.length; i++) {
    const [tk, target, tap] = keys[i];
    const p = typeof target === 'string' ? at(target) : target;
    if (t >= tk) pos = p;
    if (i + 1 < keys.length && t >= tk && t < keys[i + 1][0]) {
      const [tn, tg2] = keys[i + 1];
      const q = typeof tg2 === 'string' ? at(tg2) : tg2;
      const x = eio(prog(t, tn - .7, tn));
      pos = [lerp(p[0], q[0], x), lerp(p[1], q[1], x)];
    }
    if (tap) { const d = 1 - Math.abs(t - tk) / .14; press = Math.max(press, d > 0 ? d : 0); if (t >= tk && t < tk + .6) rip = (t - tk) / .6; }
  }
  return { pos, press, rip };
}
function caption(t, items) {
  let cur = null;
  for (const it of items) if (t >= it.a && t < it.b) cur = it;
  if (!cur) { css('caption', { opacity: 0 }); return; }
  $('chip').innerHTML = cur.chip; $('headline').innerHTML = cur.h; $('sub').innerHTML = cur.s;
  css('caption', { opacity: window_(t, cur.a, cur.b, .45) });
  show('chip', fadeIn(t, cur.a, .45), 16 * (1 - fadeIn(t, cur.a, .45)));
  show('headline', fadeIn(t, cur.a + .1, .55), 30 * (1 - fadeIn(t, cur.a + .1, .55)));
  show('sub', fadeIn(t, cur.a + .25, .55), 30 * (1 - fadeIn(t, cur.a + .25, .55)));
}
const CAPTIONS = [
  { a: .5, b: 9.3, chip: 'Rappel de 20h00 · Metformine 850 mg', h: 'La voix de sa fille,<br><em>à l’heure exacte</em>.', s: '« Coucou Mama h’biba… il est vingt heures, c’est l’heure de ton comprimé du soir. »' },
  { a: 9.5, b: 20.7, chip: 'Espace Senior · NeuroCare', h: 'Un seul bouton.<br><em>C’est fait.</em>', s: '' },
];

// ---------------------------------------------------------------- Timeline
function renderFrame(t) {
  // Fin : logo et slogan
  const outro = eio(prog(t, 26.9, 27.45));
  css('outro', { opacity: outro, display: outro > 0 ? 'flex' : 'none' });
  show('outroLogo', fadeIn(t, 27.1, .7), 0, lerp(.88, 1, eback(prog(t, 27.1, 28.0))));
  show('outroTag', fadeIn(t, 27.6, .55), 20 * (1 - fadeIn(t, 27.6, .55)));

  // Écrans du téléphone de Mama
  const sen = eio(prog(t, 9.25, 9.85));
  // Ouverture de l'application : l'écran senior monte depuis le bas, l'écran verrouillé recule.
  css('lock', { display: sen < 1 ? 'block' : 'none', opacity: 1 - .5 * sen, zIndex: 1, transform: `scale(${1 - .06 * sen})` });
  css('senior', { display: sen > 0 ? 'block' : 'none', opacity: 1, zIndex: 2, transform: `translateY(${(1 - sen) * 832}px)`,
                  borderRadius: `${30 * (1 - sen)}px`, boxShadow: sen < 1 ? '0 -10px 30px rgba(15,61,110,.25)' : 'none' });
  const onLock = sen < .5;
  css('status1', { background: onLock ? 'transparent' : '#F5F8FC', color: onLock ? '#fff' : '#112950' });
  $('clock').textContent = t < 13.75 ? '20:00' : '20:01';

  // Notification : arrivée + lecture du message vocal
  const nIn = eback(prog(t, .35, .85));
  css('lockNotif', { opacity: clamp(nIn * 1.4), transform: `translateY(${lerp(-150, 0, nIn)}px) scale(${1 - .035 * Math.max(0, 1 - Math.abs(t - 9.15) / .14)})` });
  const play = speaking(t, V.rappel);
  $('nLab').textContent = play ? 'Lecture…' : 'Écouter le message';
  for (let i = 0; i < 22; i++) css('nb' + i, { height: 4 + 20 * voiceLevel(t, V.rappel, i) + 'px', opacity: play ? 1 : .35 });

  // Espace senior : onde de la voix de Salma, appui sur « C'est fait »
  for (let i = 0; i < 30; i++) {
    const lv = voiceLevel(t, V.bravo, i);
    css('bar' + i, { height: 6 + 34 * lv + 'px', opacity: speaking(t, V.bravo) ? 1 : .3 });
  }
  $('vState').textContent = speaking(t, V.bravo) ? 'Salma vous répond…' : 'Message vocal · 0:08';
  const done = t >= SFX.tap + .03;
  const press = Math.max(0, 1 - Math.abs(t - SFX.tap) / .14);
  css('doneBtn', { background: done ? '#167A45' : '#10B981', transform: `scale(${1 - .06 * press + .03 * Math.sin(Math.PI * prog(t, SFX.tap + .05, SFX.tap + .45))})` });
  $('doneTxt').textContent = done ? 'C’est noté. Merci !' : 'C’est fait';
  css('doneTxt', { fontSize: done ? '28px' : '34px' });

  // Caméra du téléphone de Mama, puis vue côte à côte (21 s → 27 s)
  let s = 1, fx = 196, fy = 416;
  const zoomTo = (a, b, sc, x, y, d = .8) => {
    const k = Math.min(eio(prog(t, a, a + d)), 1 - eio(prog(t, b - d, b)));
    if (k > 0) { s = lerp(s, sc, k); fx = lerp(fx, x, k); fy = lerp(fy, y, k); }
  };
  zoomTo(.9, 9.2, 1.2, 196, 330, 1.0);
  zoomTo(10.0, 20.4, 1.12, 196, 470, 1.2);
  const enter = eout(prog(t, 0, .45));
  let { tx, ty } = camera(s, fx, fy);
  const side = eio(prog(t, 20.6, 21.5));
  tx = lerp(tx, 520, side); ty = lerp(ty, 205, side); s = lerp(s, .78, side);
  css('phone', { transform: `translate(${tx - PHONE.x}px, ${ty - PHONE.y + (1 - enter) * 60}px) scale(${s})`, opacity: enter });
  const p2 = eout(prog(t, 20.9, 21.7));
  css('phone2', { opacity: p2, transform: `translate(${1072 - 420 + (1 - p2) * 160}px, ${205 - 110}px) scale(.78)` });
  show('lab1', fadeIn(t, 21.2, .4), 12 * (1 - fadeIn(t, 21.2, .4)));
  show('lab2', fadeIn(t, 21.4, .4), 12 * (1 - fadeIn(t, 21.4, .4)));

  // Aidante : passage au vert en temps réel
  const conf = t >= SFX.confirm;
  css('aDot', { background: conf ? '#167A45' : '#6B7280', transform: `scale(${1 + .9 * Math.max(0, 1 - Math.abs(t - SFX.confirm - .1) / .3)})` });
  $('aStatus').textContent = conf ? 'Confirmé à 20:01' : 'En attente';
  css('aStatus', { color: conf ? '#167A45' : '#55657E', fontWeight: conf ? 800 : 400 });
  $('aSummary').textContent = conf ? '3 confirmé(s) · 0 sans réponse · 0 en attente' : '2 confirmé(s) · 0 sans réponse · 1 en attente';
  show('aToast', fadeIn(t, SFX.confirm + .15, .4), 20 * (1 - fadeIn(t, SFX.confirm + .15, .4)), lerp(.94, 1, eback(prog(t, SFX.confirm + .15, SFX.confirm + .6))));
  css('banner', { opacity: fadeIn(t, 22.4, .5) * (1 - outro), transform: `translateY(${20 * (1 - fadeIn(t, 22.4, .5))}px)` });

  // Onde vocale hors téléphone (scènes 1 et 2)
  const vLine = t < 12 ? V.rappel : V.bravo;
  const vOp = Math.max(window_(t, V.rappel[0] - .2, V.rappel[1] + .25, .3), window_(t, V.bravo[0] - .2, V.bravo[1] + .25, .3));
  $('vwLab').textContent = 'Voix de Salma, sa fille';
  $('vwIc').innerHTML = ic('volume-high', 32, '#fff');
  css('vwIc', { background: t < 12 ? '#246BFD' : '#10B981' });
  for (let i = 0; i < 28; i++) css('vb' + i, { height: 8 + 52 * voiceLevel(t, vLine, i) + 'px', background: t < 12 ? '#246BFD' : '#10B981' });
  css('vw', { opacity: vOp * (1 - side), transform: `translateY(${18 * (1 - vOp)}px)` });
  caption(t, CAPTIONS);
  if (t >= 9.5 && t < 20.7) {  // scène 2 : le sous-titre suit l'action, la citation n'apparaît qu'avec la voix
    const said = t >= V.bravo[0] - .1;
    $('sub').innerHTML = said ? '« Bravo Mama, c’est bien noté ! Passe une belle soirée. »' : 'Hajja Zahra appuie sur le gros bouton vert.';
    const k = said ? fadeIn(t, V.bravo[0] - .1, .45) : Math.min(fadeIn(t, 9.75, .55), 1 - eio(prog(t, V.bravo[0] - .45, V.bravo[0] - .1)));
    show('sub', k, 20 * (1 - k));
  }
  css('caption', { opacity: parseFloat($('caption').style.opacity || 0) * (1 - side) });

  // Doigt : ouverture de la notification, puis « C'est fait »
  const paths = [
    [8.4, 9.5, [[8.4, [300, 620], 0], [9.15, 'lockNotif', 1], [9.5, [320, 640], 0]]],
    [12.7, 14.4, [[12.7, [310, 760], 0], [SFX.tap, 'doneBtn', 1], [14.4, [320, 780], 0]]],
  ];
  let cur = { pos: null }, op = 0;
  for (const [a, b, keys] of paths) if (t >= a && t < b) { cur = cursorPath(t, keys); op = window_(t, a, b, .25); }
  if (cur.pos) cursorAt(cur.pos[0], cur.pos[1], op, cur.press, cur.rip); else { css('cursor', { opacity: 0 }); css('ripple', { opacity: 0 }); }
}
window.renderFrame = renderFrame;
window.renderStill = renderFrame;
</script>
</body>
</html>
